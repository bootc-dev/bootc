[package]
name = "bootc"
# This is a stub, the real version is from the lib crate
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bootc-dev/bootc"
publish = false
default-run = "bootc"

# See https://github.com/coreos/cargo-vendor-filterer
[package.metadata.vendor-filter]
# For now we only care about tier 1+2 Linux.  (In practice, it's unlikely there is a tier3-only Linux dependency)
platforms = ["*-unknown-linux-gnu"]

[dependencies]
# Internal crates
bootc-lib = { version = "1.16", path = "../lib", default-features = false }
bootc-utils = { package = "bootc-internal-utils", path = "../utils", version = "1.16.14" }

# Workspace dependencies
anstream = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tracing = { workspace = true }

[features]
# Forward bootc-lib's defaults (it's a dependency without default features), so
# that `--no-default-features` works for the binary too.
default = ["bootc-lib/default"]
install-to-disk = ["bootc-lib/install-to-disk"]
selinux = ["bootc-lib/selinux"]

[lints]
workspace = true
